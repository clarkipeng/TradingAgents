# Fly.io deployment for the media poller — an always-on worker (no public
# service) that polls hourly and writes to an external database (Supabase).
#
# Deploy: see the "Fly.io" section of docs/poller-deployment.md.
#   - app name must be globally unique: change `app` below or let `fly launch` pick one
#   - secrets (DB URL, source tokens) are set with `fly secrets set`, NOT here
#   - data lives in Supabase, so this machine is stateless (no Fly volume)

app = "tradagent"
primary_region = "iad"          # match your Supabase project's region (e.g. us-east-1 -> iad)

[build]
  dockerfile = "Dockerfile.poller"

# Non-secret config. Tickers/interval are safe to commit; credentials are not —
# set MEDIA_DB_URL / X_BEARER_TOKEN / TRUTHSOCIAL_TOKEN via `fly secrets set`.
[env]
  # Broad backtest universe: S&P 100/OEX-style large caps plus a few high-attention extras.
  MEDIA_POLLER_TICKERS = "AA,AAPL,ABBV,ABT,ACN,ADBE,ALB,AMAT,AMD,AMGN,AMT,AMZN,APP,ARM,AVGO,AXP,BA,BAC,BHP,BK,BKNG,BLK,BMY,BRK-B,C,CAT,CEG,CL,CLF,CMCSA,COF,COP,COST,CRM,CRWD,CSCO,CVS,CVX,DE,DHR,DIS,DUK,EMR,FCX,FDX,GD,GE,GEV,GILD,GM,GOOGL,GS,HD,HON,HOOD,IBM,INTC,INTU,ISRG,JNJ,JPM,KO,LIN,LLY,LMT,LOW,LRCX,MA,MCD,MDLZ,MDT,META,MMM,MO,MP,MRK,MS,MSFT,MSTR,MU,NEE,NEM,NFLX,NKE,NOW,NVDA,ORCL,PEP,PFE,PG,PLTR,PM,QCOM,RDDT,RIO,RTX,SBUX,SCHW,SCCO,SHOP,SMCI,SO,SOFI,SPG,T,TECK,TMO,TMUS,TSLA,TXN,UBER,UNH,UNP,UPS,USB,V,VALE,VZ,WFC,WMT,XOM"
  # Keep the wide universe source mix light; add Reddit/Bluesky later as a smaller deep-social tier.
  MEDIA_POLLER_SOURCES = "stocktwits,news"
  MEDIA_POLLER_INTERVAL = "3600"

# Restart the worker if it crashes; a clean SIGTERM during deploy won't loop.
# dedup on (source, external_id) makes a re-poll after restart harmless.
[[restart]]
  policy = "on-failure"
  max_retries = 10

# Smallest machine is ample: the poller's import surface is ~30 MB RSS and it is
# network-bound, idle most of the hour. Bump memory only if you add many tickers.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
